<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ИИ-офис</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#14213d;--mute:#5b6b8c;--glass:rgba(255,255,255,.55);--edge:rgba(255,255,255,.8);--ok:#1f9d6b;--bad:#d64550;--new:#3b6ef5}
@media (prefers-color-scheme:dark){:root{--ink:#e8eefc;--mute:#9db0d6;--glass:rgba(30,40,70,.55);--edge:rgba(255,255,255,.14)}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;
background:radial-gradient(1000px 600px at 10% -10%,#bfe3ff,transparent),radial-gradient(900px 600px at 100% 0,#ffd9ec,transparent),#eef3ff;
padding:env(safe-area-inset-top) 16px calc(40px + env(safe-area-inset-bottom))}
@media (prefers-color-scheme:dark){body{background:radial-gradient(1000px 600px at 10% -10%,#1b3a6b,transparent),radial-gradient(900px 600px at 100% 0,#4a1f47,transparent),#0c1224}}
main{max-width:760px;margin:0 auto}
h1{font-size:28px;margin:22px 0 4px}h2{font-size:19px;margin:26px 0 10px}
.sub{color:var(--mute);margin:0 0 14px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:22px;padding:16px;margin:10px 0;
backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 8px 30px rgba(40,60,120,.12)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:13px;padding:2px 10px;border-radius:99px;background:rgba(120,140,200,.2)}
.pill.new{background:var(--new);color:#fff}.pill.checked{background:var(--ok);color:#fff}.pill.problem{background:var(--bad);color:#fff}
.lbl{font-size:13px;color:var(--mute);margin:8px 0 2px}
.txt{white-space:pre-wrap;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{border:0;border-radius:14px;padding:9px 16px;background:var(--new);color:#fff;cursor:pointer;transition:transform .15s,opacity .15s}
button:active{transform:scale(.96)}button.g{background:rgba(120,140,200,.25);color:var(--ink)}
button.ok{background:var(--ok)}button.bad{background:var(--bad)}
input,select,textarea{width:100%;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.35);padding:10px 12px;margin:4px 0}
@media (prefers-color-scheme:dark){input,select,textarea{background:rgba(0,0,0,.25)}}
textarea{min-height:90px;resize:vertical}
.msg{color:var(--bad);min-height:22px;margin:6px 0}
.empty{color:var(--mute);padding:6px 0}
:focus-visible{outline:3px solid var(--new);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.hide{display:none}
#office{position:relative;border-radius:18px;overflow:hidden;border:3px solid var(--edge);margin:8px 0}
#office svg{display:block;width:100%;height:auto}
.seat{position:absolute;top:0;bottom:0;width:44%;background:none;border:0;padding:0;border-radius:0;color:#14213d}
#sa{left:4%}#sb{left:52%}
.bub{position:absolute;left:50%;top:17%;transform:translateX(-50%);width:max-content;max-width:100%;background:#fff;border:2px solid #14213d;border-radius:6px;padding:4px 8px;font:12px/1.3 ui-monospace,Menlo,monospace;text-align:center}
.bub.work{background:#dff0ff}.bub.wait{background:#fff3c9}.bub.stuck{background:#ffd9dc}
.nm{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:#14213d;color:#fff;border-radius:4px;padding:1px 10px;font:12px ui-monospace,Menlo,monospace}
.scr.work{animation:fl 1.2s steps(2) infinite}@keyframes fl{50%{fill:#7fe3a0}}
@media (prefers-reduced-motion:reduce){.scr.work{animation:none}}
.t{padding:8px 0;border-top:1px solid var(--edge)}
.b{padding:9px 13px;border-radius:16px;margin:6px 0;white-space:pre-wrap;max-width:92%}
.b.user{background:var(--new);color:#fff;margin-left:auto}.b.model{background:rgba(120,140,200,.22)}
#log{max-height:340px;overflow:auto;margin:8px 0}
</style>
</head>
<body>
<main>
<section id="login" class="hide">
  <h1>ИИ-офис</h1>
  <p class="sub">Вход только для владельца.</p>
  <div class="glass">
    <input id="em" type="email" placeholder="Почта" autocomplete="email">
    <input id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
    <div class="msg" id="lmsg"></div>
    <div class="row"><button id="bin">Войти</button><button id="bup" class="g">Создать аккаунт</button></div>
  </div>
</section>

<section id="app" class="hide">
  <div class="row" style="justify-content:space-between"><h1>ИИ-офис</h1><button class="g" id="out">Выйти</button></div>
  <p class="sub" id="stat"></p>
  <div id="office">
  <svg viewBox="0 0 160 96" shape-rendering="crispEdges" role="img" aria-label="Пиксельный офис с двумя сотрудниками">
  <rect width="160" height="96" fill="#7d8da1"/><rect width="160" height="30" fill="#b7c2ce"/><rect y="30" width="160" height="2" fill="#6a4a3b"/>
  <rect x="4" y="6" width="24" height="24" fill="#46606b"/><rect x="6" y="9" width="20" height="3" fill="#a33"/><rect x="6" y="15" width="20" height="3" fill="#3a8"/><rect x="6" y="21" width="20" height="3" fill="#c93"/>
  <rect x="34" y="4" width="26" height="26" fill="#3b4a56"/><rect x="46" y="4" width="1" height="26" fill="#2a3640"/>
  <rect x="64" y="6" width="6" height="8" fill="#eef"/><rect x="92" y="5" width="9" height="10" fill="#2db"/>
  <rect x="74" y="12" width="8" height="8" fill="#9fd3f2"/><rect x="73" y="20" width="10" height="10" fill="#e6ebef"/>
  <rect x="106" y="14" width="8" height="12" fill="#e0b64d"/><rect x="106" y="26" width="8" height="2" fill="#a88a35"/>
  <rect x="124" y="4" width="14" height="26" fill="#2f4a52"/><rect x="142" y="4" width="14" height="26" fill="#2f4a52"/>
  <g fill="#4c6b73"><rect x="126" y="8" width="10" height="4"/><rect x="126" y="16" width="10" height="4"/><rect x="126" y="24" width="10" height="4"/><rect x="144" y="8" width="10" height="4"/><rect x="144" y="16" width="10" height="4"/><rect x="144" y="24" width="10" height="4"/></g>
  <rect x="26" y="50" width="10" height="16" fill="#222"/><rect x="28" y="42" width="7" height="3" fill="#c0541e"/><rect x="28" y="45" width="7" height="5" fill="#f1c7a5"/><rect x="26" y="51" width="11" height="9" fill="#2e5aa8"/><rect x="31" y="51" width="1" height="6" fill="#c33"/>
  <rect x="14" y="58" width="52" height="12" fill="#cfd6dd"/><rect x="14" y="70" width="52" height="6" fill="#9aa6b2"/>
  <rect x="44" y="52" width="12" height="7" fill="#15151a"/><rect class="scr" id="scrA" x="45" y="53" width="10" height="5" fill="#3c6"/><rect x="44" y="60" width="12" height="2" fill="#333"/><rect x="18" y="55" width="9" height="3" fill="#fff"/><rect x="20" y="52" width="6" height="3" fill="#eee"/>
  <rect x="96" y="50" width="10" height="16" fill="#222"/><rect x="98" y="42" width="7" height="3" fill="#1b1b1b"/><rect x="98" y="45" width="7" height="5" fill="#f1c7a5"/><rect x="96" y="51" width="11" height="9" fill="#6b3fa0"/><rect x="101" y="51" width="1" height="6" fill="#eee"/>
  <rect x="84" y="58" width="52" height="12" fill="#cfd6dd"/><rect x="84" y="70" width="52" height="6" fill="#9aa6b2"/>
  <rect x="114" y="52" width="12" height="7" fill="#15151a"/><rect class="scr" id="scrB" x="115" y="53" width="10" height="5" fill="#49c"/><rect x="114" y="60" width="12" height="2" fill="#333"/><rect x="88" y="55" width="9" height="3" fill="#fff"/><rect x="90" y="52" width="6" height="3" fill="#eee"/>
  </svg>
  <button class="seat" id="sa" data-agent="claude" aria-label="Задачи Claude"><span class="bub"></span><span class="nm">Claude</span></button>
  <button class="seat" id="sb" data-agent="gemini" aria-label="Задачи Gemini"><span class="bub"></span><span class="nm">Gemini</span></button>
  </div>
  <div class="glass hide" id="tp"></div>

  <h2>Нужно твоё внимание</h2>
  <div id="attn"></div>

  <h2>Агенты и проекты</h2>
  <div id="projects"></div>

  <h2>Чат с агентом</h2>
  <div class="glass">
    <select id="cp"></select>
    <div id="log"></div>
    <textarea id="cin" placeholder="Напиши агенту задачу или вопрос" style="min-height:70px"></textarea>
    <div class="msg" id="cmsg"></div>
    <div class="row"><button id="csend">Отправить</button><button class="ok" id="crep">Составить отчёт</button><button class="g" id="cclr">Очистить чат</button></div>
    <p class="lbl">Сейчас на сайте доступен Gemini. История чата хранится до закрытия страницы, а отчёты сохраняются навсегда.</p>
  </div>

  <h2>Добавить отчёт</h2>
  <div class="glass">
    <select id="fp"></select>
    <select id="fa"></select>
    <textarea id="paste" placeholder="Вставь сюда отчёт от ИИ в формате:&#10;Что сделано: ...&#10;Что не вышло: ...&#10;Что дальше: ..."></textarea>
    <div class="row"><button class="g" id="parse">Разобрать по полям</button></div>
    <div class="lbl">Что сделано</div><textarea id="fd"></textarea>
    <div class="lbl">Что не вышло</div><textarea id="ff"></textarea>
    <div class="lbl">Что дальше</div><textarea id="fn"></textarea>
    <div class="msg" id="amsg"></div>
    <button id="save">Сохранить отчёт</button>
  </div>
</section>
</main>

<script>
const SB=supabase.createClient("https://wkswesrhdrrtivhgcnip.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indrc3dlc3JoZHJydGl2aGdjbmlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNDk2MjAsImV4cCI6MjEwNjkyNTYyMH0.sQFby4QMLKrpamWrAsUzRVKhnRdiX41K8CUy4TKLVSs");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST={new:"Новое",checked:"Проверено",problem:"Есть проблема"};
let agents=[],projects=[],reports=[];

function card(r){
  const p=projects.find(x=>x.id===r.project_id);
  const d=new Date(r.created_at).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  const blk=(l,t)=>t?`<div class="lbl">${l}</div><p class="txt">${esc(t)}</p>`:"";
  return `<div class="glass"><div class="row"><b>${esc(p?.emoji||"")} ${esc(p?.title||r.project_id)}</b>
  <span class="pill">${esc(r.agent)}</span><span class="pill ${r.status}">${ST[r.status]}</span><span class="lbl" style="margin:0">${d}</span></div>
  ${blk("Что сделано",r.done)}${blk("Что не вышло",r.failed)}${blk("Что дальше",r.next_step)}
  <div class="row" style="margin-top:12px"><button class="ok" data-s="checked" data-id="${r.id}">Проверено</button>
  <button class="bad" data-s="problem" data-id="${r.id}">Есть проблема</button></div></div>`;
}
function render(){
  drawOffice();
  const att=reports.filter(r=>r.status!=="checked");
  $("stat").textContent=`Всего отчётов: ${reports.length}. Ждут проверки: ${att.filter(r=>r.status==="new").length}. С проблемами: ${att.filter(r=>r.status==="problem").length}.`;
  $("attn").innerHTML=att.length?att.map(card).join(""):'<div class="glass empty">Всё проверено. Новых отчётов нет.</div>';
  const proj=p=>{const rs=reports.filter(r=>r.project_id===p.id);
    const n=rs.filter(r=>r.status==="new").length,pr=rs.filter(r=>r.status==="problem").length;
    return `<div class="glass" style="margin:8px 0 0"><b>${esc(p.emoji)} ${esc(p.title)}</b> <span class="lbl">отчётов: ${rs.length}${n?`, ждут проверки: ${n}`:""}${pr?`, проблем: ${pr}`:""}</span>
    ${rs.length?`<details><summary class="lbl">Показать последние</summary>${rs.slice(0,5).map(card).join("")}</details>`:'<div class="empty">Отчётов пока нет.</div>'}</div>`};
  $("projects").innerHTML=agents.map(a=>{
    const ps=projects.filter(p=>p.agent_id===a.id);
    const ar=reports.filter(r=>ps.some(p=>p.id===r.project_id));
    const last=ar[0]?new Date(ar[0].created_at).toLocaleDateString("ru-RU",{day:"numeric",month:"short"}):"нет отчётов";
    return `<div class="glass"><div class="row"><b style="font-size:18px">${esc(a.emoji)} ${esc(a.name)}</b><span class="pill">проектов: ${ps.length}</span><span class="pill">последний отчёт: ${last}</span></div>${ps.map(proj).join("")||'<div class="empty">Проекты не назначены.</div>'}</div>`;
  }).join("")+projects.filter(p=>!p.agent_id).map(proj).join("");
  if(!$("fp").options.length)fill();
}
let chats={};
function drawLog(){const h=chats[$("cp").value]||[];
  $("log").innerHTML=h.length?h.map(m=>`<div class="b ${m.role}">${esc(m.text)}</div>`).join(""):'<div class="empty">Напиши первое сообщение.</div>';
  $("log").scrollTop=1e9}
function fillChat(){const ps=projects.filter(p=>p.agent_id==="gemini");
  $("cp").innerHTML=ps.map(p=>`<option value="${esc(p.id)}">${esc(p.emoji)} ${esc(p.title)} — Gemini</option>`).join("");drawLog()}
async function callAgent(mode){
  const pid=$("cp").value;if(!pid){$("cmsg").textContent="Нет проектов, закреплённых за Gemini.";return}
  const h=chats[pid]=chats[pid]||[];
  if(!h.length){$("cmsg").textContent="Сначала напиши агенту хотя бы одно сообщение.";return}
  $("cmsg").textContent="Агент думает…";["csend","crep"].forEach(i=>$(i).disabled=true);
  const {data,error}=await SB.functions.invoke("agent-chat",{body:{project_id:pid,mode,messages:h}});
  ["csend","crep"].forEach(i=>$(i).disabled=false);
  let err=data?.error;
  if(error){try{err=(await error.context.json()).error}catch{err=error.message}}
  if(err){$("cmsg").textContent=err;return}
  $("cmsg").textContent="";
  if(mode==="chat"){h.push({role:"model",text:data.reply});drawLog()}
  else{await load();$("cmsg").textContent="Отчёт сохранён, он появился в блоке «Нужно твоё внимание».";window.scrollTo({top:0,behavior:"smooth"})}
}
$("cp").onchange=drawLog;
$("csend").onclick=()=>{const t=$("cin").value.trim();if(!t)return;const pid=$("cp").value;if(!pid)return;
  (chats[pid]=chats[pid]||[]).push({role:"user",text:t});$("cin").value="";drawLog();callAgent("chat")};
$("crep").onclick=()=>callAgent("report");
$("cclr").onclick=()=>{chats[$("cp").value]=[];$("cmsg").textContent="";drawLog()};
let tasks=[],openAgent=null;
const TS={todo:"в очереди",doing:"в работе",done:"готово",stuck:"застряло"};
function agentState(a){
  const ps=projects.filter(p=>p.agent_id===a.id).map(p=>p.id);
  const mine=tasks.filter(t=>t.agent_id===a.id);
  const stuck=mine.find(t=>t.status==="stuck"),doing=mine.find(t=>t.status==="doing");
  const wait=reports.filter(r=>ps.includes(r.project_id)&&r.status==="new").length;
  const prob=reports.filter(r=>ps.includes(r.project_id)&&r.status==="problem").length;
  const todo=mine.filter(t=>t.status==="todo").length;
  if(stuck)return["stuck","Застрял: "+stuck.title];
  if(prob)return["stuck","Проблем в отчётах: "+prob];
  if(doing)return["work","Работает: "+doing.title];
  if(wait)return["wait","Ждёт проверки: "+wait];
  return todo?["wait","Задач в очереди: "+todo]:["","Свободен"];
}
function drawOffice(){
  [["claude","sa","scrA"],["gemini","sb","scrB"]].forEach(([id,seat,scr])=>{
    const a=agents.find(x=>x.id===id);if(!a)return;
    const [cls,txt]=agentState(a);const b=$(seat).querySelector(".bub");
    b.className="bub "+cls;b.textContent=txt;$(scr).classList.toggle("work",cls==="work");
  });
  drawPanel();
}
function drawPanel(){
  const el=$("tp"),a=agents.find(x=>x.id===openAgent);
  if(!a){el.classList.add("hide");return}
  const keep=$("tti")?.value||"";
  const ps=projects.filter(p=>p.agent_id===a.id);
  const ts=tasks.filter(t=>t.agent_id===a.id).slice(0,8);
  el.classList.remove("hide");
  el.innerHTML=`<b>${esc(a.emoji)} ${esc(a.name)}: задачи</b>
  <select id="tpr">${ps.map(p=>`<option value="${esc(p.id)}">${esc(p.emoji)} ${esc(p.title)}</option>`).join("")}</select>
  <input id="tti" placeholder="Новая задача на сегодня" value="${esc(keep)}">
  <div class="msg" id="tmsg"></div><button id="tadd">Поставить задачу</button>
  ${ts.map(t=>{const p=projects.find(x=>x.id===t.project_id);return `<div class="t"><div class="row"><b>${esc(t.title)}</b><span class="pill">${esc(p?.title||"")}</span><span class="pill">${TS[t.status]}</span></div>
  <div class="row" style="margin-top:6px"><button class="g" data-t="${t.id}" data-ts="doing">В работу</button><button class="ok" data-t="${t.id}" data-ts="done">Готово</button><button class="bad" data-t="${t.id}" data-ts="stuck">Застряло</button><button class="g" data-td="${t.id}">Удалить</button></div></div>`}).join("")||'<div class="empty">Задач пока нет. Поставь первую.</div>'}`;
}
document.addEventListener("click",async e=>{
  const sb=e.target.closest(".seat");
  if(sb){openAgent=openAgent===sb.dataset.agent?null:sb.dataset.agent;drawPanel();return}
  if(e.target.id==="tadd"){
    const title=$("tti").value.trim();if(!title){$("tmsg").textContent="Напиши, что нужно сделать.";return}
    const {error}=await SB.from("ao_tasks").insert({agent_id:openAgent,project_id:$("tpr").value||null,title});
    if(error){$("tmsg").textContent="Не удалось сохранить: "+error.message;return}
    $("tti").value="";await load();return}
  const t=e.target.closest("button[data-t]"),d=e.target.closest("button[data-td]");
  if(t){await SB.from("ao_tasks").update({status:t.dataset.ts,updated_at:new Date().toISOString()}).eq("id",t.dataset.t);await load()}
  if(d){await SB.from("ao_tasks").delete().eq("id",d.dataset.td);await load()}
});
function syncAgent(){const p=projects.find(x=>x.id===$("fp").value);const a=agents.find(x=>x.id===p?.agent_id);if(a)$("fa").value=a.name}
function fill(){
  $("fp").innerHTML=projects.map(p=>`<option value="${esc(p.id)}">${esc(p.emoji)} ${esc(p.title)}</option>`).join("");
  $("fa").innerHTML=agents.map(a=>`<option>${esc(a.name)}</option>`).join("")+"<option>Другой</option>";
  syncAgent();fillChat();
}
$("fp").onchange=syncAgent;
async function load(){
  const c=await SB.from("ao_agents").select("*").order("sort");
  const a=await SB.from("ao_projects").select("*").order("sort");
  const t=await SB.from("ao_tasks").select("*").order("created_at",{ascending:false});
  const b=await SB.from("ao_reports").select("*").order("created_at",{ascending:false});
  const er=a.error||b.error||c.error;
  if(er){$("stat").textContent="Не удалось загрузить данные: "+er.message;return}
  agents=c.data;projects=a.data;reports=b.data;tasks=t.error?[]:t.data;render();
}
async function enter(){
  const {data:{session}}=await SB.auth.getSession();
  if(!session){$("app").classList.add("hide");$("login").classList.remove("hide");return}
  const {data:ok}=await SB.rpc("ao_claim");
  if(!ok){await SB.auth.signOut();$("lmsg").textContent="Этот аккаунт не имеет доступа.";$("login").classList.remove("hide");$("app").classList.add("hide");return}
  $("login").classList.add("hide");$("app").classList.remove("hide");load();
}
async function auth(up){
  $("lmsg").textContent="";
  const cred={email:$("em").value.trim(),password:$("pw").value};
  const {error}=up?await SB.auth.signUp(cred):await SB.auth.signInWithPassword(cred);
  if(error){$("lmsg").textContent=error.message;return}
  enter();
}
$("bin").onclick=()=>auth(false);$("bup").onclick=()=>auth(true);
$("out").onclick=async()=>{await SB.auth.signOut();enter()};
document.addEventListener("click",async e=>{
  const b=e.target.closest("button[data-id]");if(!b)return;
  const {error}=await SB.from("ao_reports").update({status:b.dataset.s}).eq("id",b.dataset.id);
  if(!error){const r=reports.find(x=>x.id===b.dataset.id);r.status=b.dataset.s;render()}
});
$("parse").onclick=()=>{
  const t=$("paste").value;
  const grab=(re)=>{const m=t.match(re);return m?m[1].trim():""};
  const stop="(?=\\n\\s*(?:Что сделано|Что не вышло|Что дальше|Проект)\\s*:|$)";
  $("fd").value=grab(new RegExp("Что сделано\\s*:\\s*([\\s\\S]*?)"+stop,"i"));
  $("ff").value=grab(new RegExp("Что не вышло\\s*:\\s*([\\s\\S]*?)"+stop,"i"));
  $("fn").value=grab(new RegExp("Что дальше\\s*:\\s*([\\s\\S]*?)"+stop,"i"));
};
$("save").onclick=async()=>{
  $("amsg").textContent="";
  const row={project_id:$("fp").value,agent:$("fa").value,done:$("fd").value.trim(),failed:$("ff").value.trim(),next_step:$("fn").value.trim()};
  if(!row.done&&!row.failed&&!row.next_step){$("amsg").textContent="Заполни хотя бы одно поле отчёта.";return}
  const {error}=await SB.from("ao_reports").insert(row);
  if(error){$("amsg").textContent="Не удалось сохранить: "+error.message;return}
  ["paste","fd","ff","fn"].forEach(i=>$(i).value="");load();window.scrollTo({top:0,behavior:"smooth"});
};
enter();
</script>
</body>
